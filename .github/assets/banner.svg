<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Backups Plus – configurable, rotating server backups for the Calagopus panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>

  <!-- Icon: circular arrow around a stack -->
  <g transform="translate(96 88)">
    <circle cx="72" cy="72" r="72" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M72 18a54 54 0 1 1-46.8 27" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M14 34l12 13 16-9" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="48" width="52" height="14" rx="4" fill="#38bdf8"/>
    <rect x="46" y="66" width="52" height="14" rx="4" fill="#818cf8"/>
    <rect x="46" y="84" width="52" height="14" rx="4" fill="#a78bfa"/>
  </g>

  <text x="300" y="150" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">Backups Plus</text>
  <text x="302" y="200" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28">Configurable, rotating server backups for the Calagopus panel</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="302" y="232" width="148" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="376" y="256" fill="#7dd3fc" text-anchor="middle">Backup routines</text>
    <rect x="462" y="232" width="176" height="36" rx="18" fill="#818cf8" fill-opacity="0.15"/>
    <text x="550" y="256" fill="#a5b4fc" text-anchor="middle">Automatic rotation</text>
    <rect x="650" y="232" width="116" height="36" rx="18" fill="#a78bfa" fill-opacity="0.15"/>
    <text x="708" y="256" fill="#c4b5fd" text-anchor="middle">Templates</text>
    <rect x="778" y="232" width="134" height="36" rx="18" fill="#f472b6" fill-opacity="0.15"/>
    <text x="845" y="256" fill="#f9a8d4" text-anchor="middle">Set &amp; forget</text>
  </g>
</svg>
