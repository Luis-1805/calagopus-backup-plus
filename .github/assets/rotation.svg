<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="How rotation works: the oldest hourly backup is promoted to the weekly or monthly routine when that routine is due, otherwise it is deleted.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .l { font-size: 16px; fill: #cbd5e1; }
    .s { font-size: 14px; fill: #94a3b8; }
    .b { font-size: 16px; font-weight: 600; fill: #0f172a; }
    .line { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
  </style>

  <rect width="1280" height="440" rx="24" fill="#0f172a"/>

  <!-- Hourly routine -->
  <text x="48" y="58" class="h">1 · "Hourly" creates a backup every hour and keeps 3</text>

  <g transform="translate(48 88)">
    <rect width="150" height="72" rx="12" fill="#38bdf8"/>
    <text x="75" y="32" class="b" text-anchor="middle">now</text>
    <text x="75" y="54" class="b" text-anchor="middle" font-weight="400">kept</text>

    <rect x="166" width="150" height="72" rx="12" fill="#38bdf8"/>
    <text x="241" y="32" class="b" text-anchor="middle">−1 h</text>
    <text x="241" y="54" class="b" text-anchor="middle" font-weight="400">kept</text>

    <rect x="332" width="150" height="72" rx="12" fill="#38bdf8"/>
    <text x="407" y="32" class="b" text-anchor="middle">−2 h</text>
    <text x="407" y="54" class="b" text-anchor="middle" font-weight="400">kept</text>

    <rect x="498" width="150" height="72" rx="12" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="573" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#7dd3fc">−3 h</text>
    <text x="573" y="54" text-anchor="middle" font-size="16" fill="#7dd3fc">falls out</text>
  </g>

  <!-- Branches -->
  <text x="48" y="290" class="h">2 · When it falls out,</text>
  <text x="48" y="318" class="h">a due routine takes it</text>
  <text x="48" y="346" class="h">over instead of deleting.</text>

  <path class="line" d="M621 160 V 192 H 795 V 250" marker-end="url(#arrow)"/>
  <path class="line" d="M795 192 H 1096 V 250" marker-end="url(#arrow)"/>
  <path class="line" d="M621 192 H 480 V 250" marker-end="url(#arrow)"/>

  <g transform="translate(330 258)">
    <rect width="300" height="120" rx="14" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#fca5a5">Nothing due → deleted</text>
    <text x="24" y="68" class="l">No routine wants it right now,</text>
    <text x="24" y="92" class="l">so it is removed automatically.</text>
  </g>

  <g transform="translate(650 258)">
    <rect width="290" height="120" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#c4b5fd">"Weekly" keeps 1</text>
    <text x="24" y="68" class="l">Due every Monday 00:00 →</text>
    <text x="24" y="92" class="l">takes it over, old weekly goes.</text>
  </g>

  <g transform="translate(960 258)">
    <rect width="272" height="120" rx="14" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#fdba74">"Monthly" keeps 1</text>
    <text x="24" y="68" class="l">Due on the 1st 00:00 →</text>
    <text x="24" y="92" class="l">takes it over, old monthly goes.</text>
  </g>

  <!-- Result -->
  <g transform="translate(720 88)">
    <rect width="512" height="72" rx="14" fill="#14532d" fill-opacity="0.55" stroke="#4ade80" stroke-width="2"/>
    <text x="24" y="32" font-size="18" font-weight="700" fill="#86efac">Result: always exactly 5 backups</text>
    <text x="24" y="56" class="l">3 hourly · 1 weekly (≤ 7 days) · 1 monthly (≤ 31 days)</text>
  </g>

  <text x="48" y="414" class="s">Every routine is configurable: schedule (cron, server time zone), how many to keep, max age, source routine, name template, ignored files.</text>
</svg>
