name: Feature request
description: Suggest an idea for Backups Plus
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the backup setup or problem you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Optional – your idea for a solution.
